version: '3.8'

services:
  redactor-for12:
    build: .
    container_name: redactor_app
    ports:
      - "5003:5000"
    volumes:
      - .:/app
    environment:
      - VIRTUAL_HOST=redactor.adantechti.com
      - VIRTUAL_PORT=5000
    restart: always
    networks:
      - vpti_internal_net

networks:
  vpti_internal_net:
    external: true