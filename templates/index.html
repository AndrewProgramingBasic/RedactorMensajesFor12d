<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Redactor For12d</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { display: block; margin-bottom: 1rem; width: 100%; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Generar Mensajes For12d</h2>
        <form method="post" enctype="multipart/form-data">
            <label>CDC del Ticket:</label>
            <input type="text" name="cdc" required placeholder="Ej: 39">
            <label>Archivo Excel (FOR12):</label>
            <input type="file" name="file" accept=".xlsx" required>
            <button type="submit">Procesar y Descargar .txt</button>
        </form>
    </div>
</body>
</html>
